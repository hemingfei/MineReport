[project]
name = "minereport-backend"
version = "0.1.0"
description = "MineReport 后端：A股研报挖掘系统（api + worker 共享 Postgres 任务表）"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "markitdown[docx,pdf]>=0.1.8",
    "pypdf>=6.19.0",
    "onnxruntime>=1.30",
    "python-multipart>=0.0.32",
    "akshare>=1.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
