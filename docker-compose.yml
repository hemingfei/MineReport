name: minereport

services:
  postgres:
    image: abcfy2/zhparser:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: minereport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minereport"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: ["api"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/minereport
      STORAGE_ROOT: /data/files
      ALLOW_READER_DOWNLOAD: ${ALLOW_READER_DOWNLOAD:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - filedata:/data
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/minereport
      STORAGE_ROOT: /data/files
      WORKER_ID: worker-1
    volumes:
      - filedata:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  filedata:
